<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站暂时关闭</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      color: #111827;
    }

    .card {
      width: min(90%, 520px);
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fef3c7;
      font-size: 36px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 30px;
      font-weight: 700;
    }

    p {
      margin-bottom: 8px;
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
    }

    .small {
      margin-top: 24px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⚠️</div>
    <h1>网站暂时关闭</h1>
    <p>很抱歉，本站目前正在维护或已暂时停止访问。</p>
    <p>请稍后再试，感谢您的理解与支持。</p>
    <div class="small">Temporary unavailable</div>
  </main>
</body>
</html>
